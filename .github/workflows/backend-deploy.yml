name: ByteBazaar Backend CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name bytebazaaracr123

      - name: Build Docker image
        run: |
          docker build \
            -t bytebazaaracr123.azurecr.io/bytebazaar-backend:${{ github.sha }} \
            ./backend

      - name: Push Docker image to ACR
        run: |
          docker push \
            bytebazaaracr123.azurecr.io/bytebazaar-backend:${{ github.sha }}